<header class="p-3 w-full fixed top-0 z-50 bg-gradient-to-r from-primary to-black">
    <div class="flex align-middle items-center px-10 mx-auto gap-6">

        <a href="" class="max-h=16 text-white border-r-white border-r-2 pr-6">
            Dating App
        </a>

        <nav class="flex gap-3 my-2 uppercase text-lg text-white">
            <a href="">Matches</a>
            <a href="">Lists</a>
            <a href="">Messages</a>
        </nav>

        <div class="flex align-middle ml-auto gap-3">

            @if (accountService.curentUser(); as user) {
            <div class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="flex align-center text-white text-xl gap-3 cursor-pointer">
                    <img class="w-8 h-8 rounded-full" src="/user.png" alt="use avatar">
                    <span>{{user.displayName}}</span>
                </div>
                <ul tabindex="-1" class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
                    <li><a (click)="logout()">logout</a></li>
                    <li><a>Item 2</a></li>
                </ul>
            </div>
            }
            @else {
            <form [formGroup]="loginForm" (ngSubmit)="login()" class="flex items-center gap-3">

                <input type="text" class="input" placeholder="Email" formControlName="email">

                <input type="password" class="input" placeholder="Password" formControlName="password">

                <button type="submit" class="btn">
                    Login
                </button>

            </form>
            }




        </div>

    </div>
</header>
